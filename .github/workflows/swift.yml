# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  # Copaky: hosted macOS CI disabled (macos-15 = 10x billing) — the local gate is
  # scripts/ci-local.sh + the pre-push hook. Run manually from the Actions tab if needed.
  # (was: push/pull_request on "main" and "develop")
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-15

    steps: 
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "latest-stable"

    - uses: actions/checkout@v7
      with:
        submodules: true

    - uses: actions/cache@v5
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swift-

    - name: Build
      # TODO: add KeyboardViews
      run: swift build --package-path AzooKeyCore --target SwiftUIUtils;swift build --package-path AzooKeyCore --target KeyboardThemes

    - name: Run tests
      run: echo "There is no test suits yet"
